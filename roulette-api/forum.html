<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Premium Roulette - Solid Edition</title>
    <style>
        /* Центрирование и праздничный фон */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Эффект звездного неба на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            animation: moveStar 60s linear infinite;
        }

        @keyframes moveStar {
            from { transform: translate(0, 0); }
            to { transform: translate(-25%, -25%); }
        }

        .main-container {
            position: relative;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9);
            text-align: center;
            width: 400px;
            z-index: 10;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        #wheel {
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
            border-radius: 50%;
            border: 8px solid #141414;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 45px;
            background: #ffcc00;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 30;
            filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.5));
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        #spinBtn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.3);
        }

        #spinBtn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="380" height="380"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="NICKNAME">
        <div class="key-row">
            <input type="text" id="code" placeholder="KEY" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">SPIN</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            
            // ЧИСТЫЙ ЦВЕТ СЕКТОРА (без градиента)
            ctx.fillStyle = item.color || '#444';
            ctx.beginPath();
            ctx.moveTo(190, 190);
            ctx.arc(190, 190, 185, angle, angle + arc);
            ctx.fill();

            // Золотая обводка секторов для четкости
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Текст приза
            ctx.save();
            ctx.translate(190, 190);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 10px Arial";
            ctx.fillText(item.name.toUpperCase(), 170, 5);
            ctx.restore();
        });

        // Центр колеса
        ctx.beginPath();
        ctx.arc(190, 190, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#141414';
        ctx.fill();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes;
            drawWheel(prizes);
        } catch(e) { console.error(e); }
    }

    async function doSpin() {
        const code = document.getElementById('code').value.trim();
        const nick = document.getElementById('nickname').value.trim();
        const btn = document.getElementById('spinBtn');

        if(!code || !nick) return alert("Enter data!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const stopAngle = 270 - ((data.index * (360/totalSegments)) + (180/totalSegments));
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.15, 0, 0.15, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`WIN: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes();
            }, 6500);
        } catch (e) {
            alert("Error");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
