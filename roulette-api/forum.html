<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Premium Animated Roulette</title>
    <style>
        body {
            /* Темный градиент на фоне */
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* АНИМАЦИЯ ФОНА */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            animation: moveBackground 60s linear infinite;
        }

        @keyframes moveBackground {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        .main-container {
            position: relative;
            background: #161d2b; /* Цвет из примера */
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
            width: 480px;
            z-index: 10;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            /* Свечение под колесом */
            background: radial-gradient(circle, rgba(124, 77, 255, 0.1) 0%, transparent 70%);
        }

        #wheel {
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
            border-radius: 50%;
            border: 6px solid #2d3648; /* Тонкий матовый обод */
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 38px;
            background: #ff4d4d; /* Красный указатель */
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 30;
            filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.6));
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        /* Стиль инпутов как на скрине */
        input {
            width: 85%;
            background: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            outline: none;
            text-align: center;
        }

        .key-row {
            display: flex;
            width: 93%;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        #code {
            flex: 1;
            padding: 14px;
            border: none;
            text-align: center;
        }

        /* Фиолетовая кнопка */
        #spinBtn {
            background: #7c4dff;
            color: #fff;
            border: none;
            padding: 0 25px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        #spinBtn:hover:not(:disabled) {
            background: #6c3ce9;
        }

        #spinBtn:disabled {
            background: #4b5563;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="420" height="420"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="ВАШ НИКНЕЙМ">
        <div class="key-row">
            <input type="text" id="code" placeholder="ВАШ КЛЮЧ">
            <button id="spinBtn" onclick="doSpin()">КРУТИТЬ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        const centerX = 210;
        const centerY = 210;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            ctx.fillStyle = item.color || '#333';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, 205, angle, angle + arc);
            ctx.fill();

            // Текст призов
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 11px Arial";
            ctx.fillText(item.name.toUpperCase(), 195, 5);
            ctx.restore();
        });

        // Матовый центр
        ctx.beginPath();
        ctx.arc(centerX, centerY, 18, 0, Math.PI * 2);
        ctx.fillStyle = '#161d2b';
        ctx.fill();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            drawWheel(data.prizes);
        } catch(e) { console.error(e); }
    }

    async function doSpin() {
        const code = document.getElementById('code').value.trim();
        const nick = document.getElementById('nickname').value.trim();
        const btn = document.getElementById('spinBtn');

        if(!code || !nick) return alert("Заполните поля!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const stopAngle = 270 - ((data.index * segmentAngle) + (segmentAngle / 2));
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.1, 0, 0.1, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ВЫИГРЫШ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes();
            }, 6500);
        } catch (e) {
            alert("Ошибка связи");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
