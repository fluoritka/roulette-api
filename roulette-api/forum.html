<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Forum Roulette Style</title>
    <style>
        body {
            background: #161d2b; /* Цвет фона как на скрине */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .main-container {
            background: #161d2b;
            padding: 40px;
            text-align: center;
            width: 500px;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: inline-block;
        }

        #wheel {
            border-radius: 50%;
            border: 10px solid #2d3648; /* Серая рамка вокруг колеса */
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #ff4d4d; /* Красный треугольник */
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            filter: drop-shadow(0 0 10px rgba(255, 77, 77, 0.5));
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* Поле Никнейм */
        #nickname {
            width: 350px;
            padding: 12px 20px;
            border-radius: 25px; /* Полное закругление */
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background: #fff;
            text-transform: uppercase;
        }

        /* Группа Ключ + Кнопка */
        .key-row {
            display: flex;
            width: 390px;
            background: #fff;
            border-radius: 10px; /* Общее закругление для ряда */
            overflow: hidden;
        }

        #code {
            flex: 1;
            border: none;
            padding: 15px;
            font-size: 14px;
            outline: none;
            text-transform: uppercase;
            color: #333;
        }

        #spinBtn {
            background: linear-gradient(90deg, #8e54ff 0%, #7033ff 100%);
            color: #fff;
            border: none;
            padding: 0 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            transition: 0.3s;
        }

        #spinBtn:hover {
            opacity: 0.9;
        }

        #spinBtn:disabled {
            background: #555;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="ВАШ НИКНЕЙМ">
        <div class="key-row">
            <input type="text" id="code" placeholder="ВАШ КЛЮЧ">
            <button id="spinBtn" onclick="doSpin()">КРУТИТЬ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    // Отрисовка колеса с плоскими цветами без градиентов
    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            
            ctx.fillStyle = item.color || '#444';
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, angle, angle + arc);
            ctx.fill();

            // Текст
            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px Arial";
            ctx.fillText(item.name.toUpperCase(), 180, 5);
            ctx.restore();
        });

        // Черный центр
        ctx.beginPath();
        ctx.arc(200, 200, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#161d2b';
        ctx.fill();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            drawWheel(data.prizes);
        } catch(e) { console.error(e); }
    }

    async function doSpin() {
        const code = document.getElementById('code').value.trim();
        const nick = document.getElementById('nickname').value.trim();
        if(!code || !nick) return alert("Введите данные!");

        const btn = document.getElementById('spinBtn');
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const stopAngle = 270 - ((data.index * segmentAngle) + (segmentAngle / 2));
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.15, 0, 0.15, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ВЫИГРЫШ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes();
            }, 6500);
        } catch (e) {
            alert("Ошибка сети");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
