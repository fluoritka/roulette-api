<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Premium Roulette - Grand Casino Edition</title>
    <style>
        /* Глобальные настройки страницы для идеального центрирования */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Анимированный фон с частицами */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.15;
            animation: moveStar 60s linear infinite;
        }

        @keyframes moveStar {
            from { transform: translate(0, 0); }
            to { transform: translate(-25%, -25%); }
        }

        /* Основной контейнер рулетки */
        .main-container {
            position: relative;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(15px); /* Эффект матового стекла */
            padding: 30px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.15); /* Золотистая окантовка */
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), 
                        inset 0 0 30px rgba(255, 255, 255, 0.02);
            text-align: center;
            width: 400px; /* Фиксируем ширину для центрирования в iframe */
            z-index: 10;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        /* Само колесо */
        #wheel {
            filter: drop-shadow(0 0 25px rgba(0,0,0,0.9));
            border-radius: 50%;
            border: 10px solid #141414; /* Массивный корпус колеса */
        }

        /* Указатель (стрелка) */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 45px;
            background: linear-gradient(to bottom, #ffcc00, #ff9900);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 30;
            filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.5));
        }

        /* Поля ввода и кнопки */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 1.5px;
        }

        input:focus {
            border-color: #ffcc00;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        #spinBtn {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            color: #000;
            border: none;
            padding: 0 25px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(255, 153, 0, 0.3);
        }

        #spinBtn:hover:not(:disabled) {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 153, 0, 0.5);
        }

        #spinBtn:disabled {
            background: #2a2a2a;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="380" height="380"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="NICKNAME">
        <div class="key-row">
            <input type="text" id="code" placeholder="ACCESS KEY" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">SPIN</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    // Создаем неоновый градиент для каждого сектора
    function createNeonGradient(color, angle, arc) {
        const centerX = 190;
        const centerY = 190;
        // Радиальный градиент: от темного центра к яркому цвету из таблицы
        const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 190);
        grad.addColorStop(0, '#161625'); 
        grad.addColorStop(0.8, color || '#444'); // Цвет из колонки D
        grad.addColorStop(1, '#000'); 
        return grad;
    }

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            
            // Рисуем сектор
            ctx.fillStyle = createNeonGradient(item.color, angle, arc);
            ctx.beginPath();
            ctx.moveTo(190, 190);
            ctx.arc(190, 190, 185, angle, angle + arc);
            ctx.fill();

            // Тонкая разделительная линия
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Текст приза (белый с небольшой тенью)
            ctx.save();
            ctx.translate(190, 190);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 4;
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.font = "bold 10px Arial";
            ctx.fillText(item.name.toUpperCase(), 170, 5);
            ctx.restore();
        });

        // Центральный декоративный элемент
        ctx.beginPath();
        ctx.arc(190, 190, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#0d0d15';
        ctx.fill();
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes; // Берем объекты с цветами
            drawWheel(prizes);
        } catch(e) { console.error("Data load error", e); }
    }

    async function doSpin() {
        const codeInput = document.getElementById('code');
        const nickInput = document.getElementById('nickname');
        const btn = document.getElementById('spinBtn');

        const code = codeInput.value.trim();
        const nick = nickInput.value.trim();

        if(!code || !nick) return alert("Please enter Nickname and Key!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const prizeCenterAngle = (data.index * segmentAngle) + (segmentAngle / 2);
            const stopAngle = 270 - prizeCenterAngle;
            const totalRotation = 3600 + stopAngle;

            // Плавная анимация вращения
            canvas.style.transition = 'transform 6s cubic-bezier(0.15, 0, 0.15, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ПОЗДРАВЛЯЕМ! ВЫ ВЫИГРАЛИ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes(); // Обновляем остатки в таблице
            }, 6500);

        } catch (e) {
            alert("Connection error");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
