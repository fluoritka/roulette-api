<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Grand Casino Roulette - Forum Version</title>
    <style>
        /* Глобальные настройки для центрирования */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Фон Grand Casino: Глубокий темно-бордовый с золотыми бликами */
            background: radial-gradient(circle at center, #3a0e1c 0%, #1a060d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Анимированные золотые частицы на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.1;
            animation: moveStar 100s linear infinite;
        }

        @keyframes moveStar {
            from { transform: translate(0, 0); }
            to { transform: translate(-25%, -25%); }
        }

        /* Премиальный блок рулетки */
        .main-container {
            position: relative;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 40px;
            /* Золотая "пыль" и свечение по краям */
            border: 2px solid rgba(255, 215, 0, 0.4); 
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), 
                        inset 0 0 30px rgba(255, 215, 0, 0.05);
            text-align: center;
            width: 400px; /* Четкое центрирование в iframe */
            z-index: 10;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        /* Само колесо с массивным ободом */
        #wheel {
            filter: drop-shadow(0 0 30px rgba(0,0,0,1));
            border-radius: 50%;
            border: 10px solid #141414; /* Черный массивный корпус */
        }

        /* Золотой указатель (стрелка) */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 50px;
            background: linear-gradient(to bottom, #ffd700 0%, #ffcc00 100%);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 30;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        }

        /* Стилизация полей ввода */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.1);
            padding: 16px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00; /* Текст в инпутах - золотой */
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 1.5px;
        }

        input:focus {
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        /* Кнопка "КРУТИТЬ" - Роскошная золотая */
        #spinBtn {
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            color: #8b0000; /* Красный текст на золотом фоне */
            border: none;
            padding: 0 25px;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
        }

        #spinBtn:hover:not(:disabled) {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 215, 0, 0.5);
        }

        #spinBtn:disabled {
            background: #2a2a2a;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="380" height="380"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="NICKNAME">
        <div class="key-row">
            <input type="text" id="code" placeholder="ACCESS KEY" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">SPIN</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    // ГРАДИЕНТЫ ДЛЯ СЕКТОРОВ
    const goldGrad = '#ffd700'; // Текстурированное золото
    const redGrad = '#8b0000';  // Глубокий красный

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            const isGoldSegment = i % 2 === 0;

            // Рисуем сектор
            ctx.fillStyle = isGoldSegment ? goldGrad : redGrad;
            ctx.beginPath();
            ctx.moveTo(190, 190);
            ctx.arc(190, 190, 185, angle, angle + arc);
            ctx.fill();

            // Золотая разделительная нить
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // ТЕКСТ ПРИЗА
            ctx.save();
            ctx.translate(190, 190);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            
            // Логика текста: Красный на золоте, Бело-Золотой на красном
            if (isGoldSegment) {
                ctx.fillStyle = "#8b0000"; // Красный текст
            } else {
                ctx.fillStyle = "#fff"; // Бело-Золотой текст
                ctx.shadowBlur = 4;
                ctx.shadowColor = "rgba(255, 215, 0, 0.8)"; 
            }

            ctx.font = "bold 11px Arial";
            ctx.fillText(item.name.toUpperCase(), 170, 5);
            ctx.restore();
        });

        // Центральная «золотая» втулка
        ctx.beginPath();
        ctx.arc(190, 190, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#141414';
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes; 
            drawWheel(prizes);
        } catch(e) { console.error("Error", e); }
    }

    async function doSpin() {
        const codeInput = document.getElementById('code');
        const nickInput = document.getElementById('nickname');
        const btn = document.getElementById('spinBtn');

        const code = codeInput.value.trim();
        const nick = nickInput.value.trim();

        if(!code || !nick) return alert("Please enter all data!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const stopAngle = 270 - ((data.index * (360/totalSegments)) + (180/totalSegments));
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.15, 0, 0.15, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`CONGRATULATIONS! YOU WON: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes(); 
            }, 6500);

        } catch (e) {
            alert("Connection error");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
