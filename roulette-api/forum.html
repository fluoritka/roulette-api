<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roulette Edition</title>
    <style>
        body {
            background: #0d0d15;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .main-container {
            position: relative;
            background: #161625;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 480px; /* Немного расширил контейнер для крупного колеса */
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        #wheel {
            /* Убрал внешнюю обводку, оставил только тень */
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
            border-radius: 50%;
        }

        /* УКАЗАТЕЛЬ С ЭФФЕКТОМ СВЕЧЕНИЯ */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            background: #ff4444; /* Яркий красный */
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            /* Неоновое свечение указателя */
            filter: drop-shadow(0 0 8px #ff4444);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            background: #1f1f33;
            border: 1px solid #2d2d44; /* Матовая нейтральная граница */
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            outline: none;
            text-align: center;
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        #spinBtn {
            background: #7c4dff; /* Фиолетовый как на референсе */
            color: #fff;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        #spinBtn:hover {
            background: #6c3ce9;
            transform: translateY(-1px);
        }

        #spinBtn:disabled {
            background: #333;
            color: #777;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="440" height="440"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="ВАШ НИКНЕЙМ">
        <div class="key-row">
            <input type="text" id="code" placeholder="КЛЮЧ ДОСТУПА" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">КРУТИТЬ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        const centerX = 220; // Центр для 440px
        const centerY = 220;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            
            // СЕКТОР (Просто цвет без градиента)
            ctx.fillStyle = item.color || '#333';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, 215, angle, angle + arc); // Увеличил радиус до 215
            ctx.fill();

            // Тонкие черные разделители
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // ТЕКСТ
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 11px Arial";
            ctx.fillText(item.name.toUpperCase(), 200, 5);
            ctx.restore();
        });

        // ЦЕНТРАЛЬНЫЙ КРУГ (Матовый)
        ctx.beginPath();
        ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#0d0d15';
        ctx.fill();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes;
            drawWheel(prizes);
        } catch(e) { console.error(e); }
    }

    async function doSpin() {
        const code = document.getElementById('code').value.trim();
        const nick = document.getElementById('nickname').value.trim();
        const btn = document.getElementById('spinBtn');

        if(!code || !nick) return alert("Заполните поля!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const stopAngle = 270 - ((data.index * segmentAngle) + (segmentAngle / 2));
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 5s cubic-bezier(0.1, 0, 0, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ВЫИГРЫШ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes();
            }, 5500);
        } catch (e) {
            alert("Ошибка");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
