<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roulette Wheel - Grand Casino Edition</title>
    <style>
        body {
            /* Глубокий премиальный фон с градиентом */
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные золотые монеты/пыль на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2;
            animation: moveBackground 50s linear infinite;
        }

        @keyframes moveBackground {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        .main-container {
            position: relative;
            background: rgba(26, 29, 46, 0.85); /* Полупрозрачный темный контейнер */
            backdrop-filter: blur(15px); /* Эффект матового стекла */
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.15); /* Золотистая окантовка */
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
            width: 440px;
            z-index: 5;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            /* Золотое сияние под колесом */
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
        }

        #wheel {
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
            border-radius: 50%;
            border: 8px solid #141414; /* Массивный черный обод колеса */
        }

        /* Золотой указатель (стрелка) */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 50px;
            background: linear-gradient(to bottom, #ffe066, #ffcc00);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            filter: drop-shadow(0 0 10px rgba(255, 224, 102, 0.6));
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: rgba(255, 255, 255, 0.05); /* Полупрозрачный матовый фон инпутов */
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffcc00; /* Золотистое свечение при фокусе */
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        /* Золотая кнопка "КРУТИТЬ" */
        #spinBtn {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            color: #600; /* Темно-красный текст для контраста */
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4);
        }

        #spinBtn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.6);
        }

        #spinBtn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="380" height="380"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="NICKNAME">
        <div class="key-row">
            <input type="text" id="code" placeholder="КЛЮЧ ДОСТУПА" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">КРУТИТЬ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    // Используем плоские цвета для сегментов
    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            ctx.fillStyle = item.color || '#444'; // Цвет из колонки D
            ctx.beginPath();
            ctx.moveTo(190, 190);
            ctx.arc(190, 190, 185, angle, angle + arc);
            ctx.fill();

            // Тонкая разделительная линия
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Текст приза (белый)
            ctx.save();
            ctx.translate(190, 190);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 10px Arial";
            ctx.fillText(item.name.toUpperCase(), 170, 5);
            ctx.restore();
        });

        // Черный центр
        ctx.beginPath();
        ctx.arc(190, 190, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#141414';
        ctx.fill();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes;
            drawWheel(prizes);
        } catch(e) { console.error("Error loading prizes", e); }
    }

    async function doSpin() {
        const codeInput = document.getElementById('code');
        const nickInput = document.getElementById('nickname');
        const btn = document.getElementById('spinBtn');

        const code = codeInput.value.trim();
        const nick = nickInput.value.trim();

        if(!code || !nick) return alert("Введите все данные!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const prizeCenterAngle = (data.index * segmentAngle) + (segmentAngle / 2);
            const stopAngle = 270 - prizeCenterAngle;
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.1, 0, 0, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ПОЗДРАВЛЯЕМ! ВЫ ВЫИГРАЛИ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes(); 
            }, 6500);

        } catch (e) {
            alert("Ошибка связи");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
