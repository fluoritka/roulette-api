<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Grand Casino Edition - Forum</title>
    <style>
        /* Глобальные настройки для идеального центрирования на форуме */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent; /* Чтобы форум подсвечивал фон */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ГЛАВНЫЙ КОРПУС РУЛЕТКИ (Матовый темный) */
        .main-container {
            position: relative;
            background: #1a1a2e; /* Очень темный сине-серый */
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
            width: 420px; /* Идеально для iframe 460px */
            z-index: 10;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        /* Само колесо с четким ободом */
        #wheel {
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
            border-radius: 50%;
            border: 8px solid #141414; /* Темный обод */
        }

        /* Золотой указатель (Стрелка) */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 45px;
            background: linear-gradient(to bottom, #ffd700 0%, #ffcc00 100%);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 30;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        /* ПОЛЯ ВВОДА И КНОПКА */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #d4af37; /* Золотисто-желтый текст в инпутах */
            outline: none;
            text-align: center;
            letter-spacing: 1.5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        input:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        /* ФИОЛЕТОВАЯ КНОПКА «КРУТИТЬ» */
        #spinBtn {
            background: #8b5cf6;
            color: #ffffff; /* Белый текст на фиолетовом */
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
        }

        #spinBtn:hover:not(:disabled) {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.5);
        }

        #spinBtn:disabled {
            background: #4b5563;
            color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="380" height="380"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="ВАШ НИКНЕЙМ">
        <div class="key-row">
            <input type="text" id="code" placeholder="ВАШ КЛЮЧ ДОСТУПА" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">КРУТИТЬ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    // Создаем неоновое свечение для сектора
    function createNeonGradient(color, angle, arc) {
        const grad = ctx.createRadialGradient(190, 190, 0, 190, 190, 190);
        grad.addColorStop(0, '#10101a'); // Темный центр
        grad.addColorStop(0.85, color);  // Яркий цвет из таблицы
        grad.addColorStop(1, '#000');    // Затемнение у края
        return grad;
    }

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            
            // Задаем неоновый градиент
            ctx.fillStyle = createNeonGradient(item.color || '#444', angle, arc);
            
            ctx.beginPath();
            ctx.moveTo(190, 190);
            ctx.arc(190, 190, 185, angle, angle + arc);
            ctx.fill();

            // Четкая золотистая разделительная нить
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // ТЕКСТ ПРИЗА (Белый, уменьшенный)
            ctx.save();
            ctx.translate(190, 190);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 5;
            ctx.shadowColor = item.color;
            ctx.font = "bold 10px Arial";
            ctx.fillText(item.name.toUpperCase(), 170, 5);
            ctx.restore();
        });

        // Центральная декоративная втулка
        ctx.beginPath();
        ctx.arc(190, 190, 20, 0, Math.PI * 2);
        ctx.fillStyle = '#141414';
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes; 
            drawWheel(prizes);
        } catch(e) { console.error("Error loading prizes", e); }
    }

    async function doSpin() {
        const codeInput = document.getElementById('code');
        const nickInput = document.getElementById('nickname');
        const btn = document.getElementById('spinBtn');

        const code = codeInput.value.trim();
        const nick = nickInput.value.trim();

        if(!code || !nick) return alert("Введите все данные!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const prizeCenterAngle = (data.index * segmentAngle) + (segmentAngle / 2);
            const stopAngle = 270 - prizeCenterAngle;
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.1, 0, 0.1, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ПОЗДРАВЛЯЕМ! ВЫ ВЫИГРАЛИ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes(); 
            }, 6500);

        } catch (e) {
            alert("Ошибка связи");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
