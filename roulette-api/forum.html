<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Premium Roulette - Grand Casino</title>
    <style>
        body {
            /* Глубокий премиальный фон с градиентом */
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные золотые блики на фоне */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.2;
            animation: moveBackground 50s linear infinite;
        }

        @keyframes moveBackground {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        .main-container {
            position: relative;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.2); /* Тонкая золотая рамка */
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.05);
            text-align: center;
            width: 460px;
            z-index: 5;
        }

        .canvas-wrapper {
            position: relative;
            margin-bottom: 30px;
            padding: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
        }

        #wheel {
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
            border-radius: 50%;
            border: 8px solid #1a1a1a; /* Массивный обод */
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #ffcc00;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            filter: drop-shadow(0 0 10px #ffcc00);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }

        .key-row {
            display: flex;
            gap: 10px;
        }

        #spinBtn {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            color: #000;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.4);
        }

        #spinBtn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.6);
        }

        #spinBtn:disabled {
            background: #333;
            color: #666;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div class="input-group">
        <input type="text" id="nickname" placeholder="NICKNAME">
        <div class="key-row">
            <input type="text" id="code" placeholder="КЛЮЧ ДОСТУПА" style="flex: 1;">
            <button id="spinBtn" onclick="doSpin()">КРУТИТЬ</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const API_URL = "https://roulette-api-2.onrender.com";

    let prizes = [];

    // Создаем эффект неонового градиента для сектора
    function getNeonGradient(color, angle, arc) {
        const grad = ctx.createRadialGradient(200, 200, 0, 200, 200, 200);
        grad.addColorStop(0, '#1a1a2e'); // Темный центр
        grad.addColorStop(0.85, color);  // Основной цвет из таблицы
        grad.addColorStop(1, '#000');    // Затемнение у края
        return grad;
    }

    function drawWheel(list) {
        const segments = list.length;
        const arc = (2 * Math.PI) / segments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        list.forEach((item, i) => {
            const angle = i * arc;
            
            // Сектор
            ctx.fillStyle = getNeonGradient(item.color || '#444', angle, arc);
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 195, angle, angle + arc);
            ctx.fill();

            // Золотая разделительная нить
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Текст с эффектом свечения
            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 5;
            ctx.shadowColor = item.color;
            ctx.font = "bold 10px Arial";
            ctx.fillText(item.name.toUpperCase(), 175, 5);
            ctx.restore();
        });

        // Центральная «золотая» втулка
        ctx.beginPath();
        ctx.arc(200, 200, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#0d0d15';
        ctx.fill();
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    async function loadPrizes() {
        try {
            const res = await fetch(`${API_URL}/get_prizes_list`);
            const data = await res.json();
            prizes = data.prizes;
            drawWheel(prizes);
        } catch(e) { console.error("API Error", e); }
    }

    async function doSpin() {
        const codeInput = document.getElementById('code');
        const nickInput = document.getElementById('nickname');
        const btn = document.getElementById('spinBtn');

        const code = codeInput.value.trim();
        const nick = nickInput.value.trim();

        if(!code || !nick) return alert("Введите данные!");
        btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, nickname: nick })
            });
            const data = await res.json();

            if(!data.success) {
                alert(data.message);
                btn.disabled = false;
                return;
            }

            const totalSegments = data.total_segments;
            const segmentAngle = 360 / totalSegments;
            const prizeCenterAngle = (data.index * segmentAngle) + (segmentAngle / 2);
            const stopAngle = 270 - prizeCenterAngle;
            const totalRotation = 3600 + stopAngle;

            canvas.style.transition = 'transform 6s cubic-bezier(0.2, 0, 0.1, 1)';
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                alert(`ВЫИГРЫШ: ${data.prize}`);
                canvas.style.transition = 'none';
                canvas.style.transform = `rotate(${stopAngle % 360}deg)`;
                btn.disabled = false;
                loadPrizes();
            }, 6500);

        } catch (e) {
            alert("Сервер недоступен");
            btn.disabled = false;
        }
    }

    loadPrizes();
</script>
</body>
</html>
